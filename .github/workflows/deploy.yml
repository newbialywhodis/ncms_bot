name: Deploy to Oracle VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/ncms_bot || { echo "Błąd: folder ~/ncms_bot nie istnieje"; exit 1; }

            echo "Aktualizacja repozytorium..."
            git fetch --all
            git reset --hard origin/main
            git clean -fd

            echo "Instalacja zależności..."
            /home/ubuntu/.bun/bin/bun install --frozen-lockfile

            echo "Rejestracja komend Discord..."
            /home/ubuntu/.bun/bin/bun run src/deploy-commands.ts

            echo "Restart bota..."
            /home/ubuntu/.bun/bin/pm2 reload ncms-bot --update-env || /home/ubuntu/.bun/bin/pm2 restart ncms-bot
            /home/ubuntu/.bun/bin/pm2 save

            echo "Deploy zakończony pomyślnie o $(date '+%Y-%m-%d %H:%M:%S')"
